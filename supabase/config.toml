[functions.painel-fichas]
enabled = true
# verify_jwt=false somente porque a Edge valida internamente o Bearer no Auth,
# a sessão ativa, o vínculo owner e AAL2. Não habilita acesso anônimo/legado.
verify_jwt = false
import_map = "./functions/painel-fichas/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/painel-fichas/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/painel-fichas/*.html" ]

[functions.agenda-fichas]
enabled = true
# Validação interna obrigatória: Bearer, sessão ativa, owner e AAL2.
verify_jwt = false
import_map = "./functions/agenda-fichas/deno.json"
entrypoint = "./functions/agenda-fichas/index.ts"

[functions.anamnese-submit]
enabled = true
# Formulário público de paciente: não há conta Auth. A função aplica CORS,
# honeypot, limite de corpo, validação clínica, rate limit e idempotência.
verify_jwt = false
import_map = "./functions/anamnese-submit/deno.json"
entrypoint = "./functions/anamnese-submit/index.ts"

[functions.financeiro-fichas]
enabled = true
# JWT é validado no corpo para também exigir sessão ativa, owner e AAL2.
# Senha compartilhada legada é recusada explicitamente neste endpoint.
verify_jwt = false
import_map = "./functions/financeiro-fichas/deno.json"
entrypoint = "./functions/financeiro-fichas/index.ts"

