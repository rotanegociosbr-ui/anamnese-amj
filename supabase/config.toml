
[functions.tcle-submit]
enabled = true
verify_jwt = false
import_map = "./functions/tcle-submit/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/tcle-submit/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/tcle-submit/*.html" ]

[functions.tcle-preenchimento-submit]
enabled = true
verify_jwt = false
import_map = "./functions/tcle-preenchimento-submit/deno.json"
entrypoint = "./functions/tcle-preenchimento-submit/index.ts"

